[metadata]
name = marsha
description = A FUN video provider for Open edX
version = 5.12.5
author = Open FUN (France Universite Numerique)
author_email = fun.dev@fun-mooc.fr
license = MIT
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Education
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Framework :: Django
    Framework :: Django :: 4.2
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3 :: Only
keywords =
    video
    open-edx
    accessibility
    a11y
url = https://github.com/openfun/marsha
requires-python = >=3.9

[options]
install_requires =
    Brotli==1.2.0
    boto3==1.43.98
    celery==5.6.3
    channels-redis==4.3.0
    channels[daphne]==4.3.2
    chardet==7.6.0
    coreapi==2.3.3
    cryptography==50.0.1
    dj-database-url==3.1.2
    dj-rest-auth==7.2.0
    django-configurations==2.5.1
    django-cors-headers==4.9.0
    django-extensions==4.1
    django-filter==26.1
    django-parler==2.4
    django-redis==7.0.0
    django-safedelete==1.5.0
    django-storages==1.14.3
    django-peertube-runner-connector==0.12.1
    django-waffle==5.0.0
    Django==5.0.9
    djangorestframework==3.18.1
    djangorestframework_simplejwt==5.5.1
    dockerflow==2026.3.4
    drf-spectacular==0.30.0
    ffmpeg-python==0.2.0
    gunicorn==26.2.0
    logging-ldp==0.0.7
    lxml==6.1.3
    oauthlib==3.3.1
    Pillow==12.3.0
    psycopg[binary]==3.3.6
    pycaption==2.3.9
    PyMuPDF==1.28.2
    python-dateutil==2.9.0.post0
    requests==2.34.2
    sentry-sdk==2.69.2
    social-auth-app-django==6.0.1
    social-auth-core[saml]==5.1.1
    social-edu-federation==2.1.1
    urllib3==2.8.0
    uvicorn[standard]==0.53.0
    whitenoise==6.12.0
    xmlsec==1.3.17
    xmpppy==0.7.4

# App BBB
    xmltodict==1.0.4
packages = find:
package_dir =
    =.
zip_safe = True

[options.packages.find]
exclude =
    tests

[options.entry_points]
console_scripts =
# the ones provided with django are made unusable by django-configurations
    django-admin = configurations.management:execute_from_command_line
    django-admin.py = configurations.management:execute_from_command_line

[options.extras_require]
dev =
    bandit==1.9.4
    black==26.5.1
    cookiecutter==2.7.1
    factory_boy==3.3.3
    flake8==7.3.0
    ipython==9.17.1
    isort==9.0.1
    pdbpp==0.12.1
    pycodestyle==2.14.0
    pylint-django==2.8.0
    pylint-plugin-utils==0.9.0
    pylint==4.0.8
    pytest-cov==7.1.0
    pytest-django==4.14.0
    pytest-mock==3.15.1
    pytest==9.1.1
    responses==0.26.3
    signxml==5.1.0
    wheel==0.48.0

e2e =
    playwright==1.63.0
    pytest-playwright==0.9.0
# mcr.microsoft.com/playwright:jammy requires tzdata
    tzdata==2026.4

[bdist_wheel]
universal = 1

[flake8]
max-line-length = 99
exclude =
    .cookiecutter
    .git
    .venv
    build
    dist
    docs
    manage.py
    venv
    __pycache__
    *.egg-info
    */migrations/*
    stubs.py

[pycodestyle]
max-line-length = 99

[tool:pytest]
addopts = -v --cov-report term-missing
python_files =
    test_*.py
    tests.py
testpaths =
    marsha

[coverage:run]
branch = True

[isort]
combine_as_imports = 1
default_section = THIRDPARTY
force_sort_within_sections = 1
from_first = 1
include_trailing_comma = 1
indent = '    '
known_django = django
known_first_party = marsha
line_length = 88
lines_after_imports = 2
multi_line_output = 3
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
extend_skip = .cookiecutter
use_parentheses = 1
